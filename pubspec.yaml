name: asawatch
description: "AsaWatch — aplikasi pendamping smartwatch untuk memantau detak jantung, gula darah, tekanan darah, dan tidur."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  # Hanya untuk permukaan sesi makan (docs/rancangan-ui-sesi-makan.md §12.7):
  # sampel bisa masuk dari BLE kapan saja, dari tab mana pun. Alur auth dan
  # profil tetap memakai pola Navigator.pop(true).
  provider: ^6.1.2
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  # Dipatok ke 1.x dengan sengaja: 2.x berpindah ke lisensi yang menuntut
  # pembelian untuk penggunaan komersial, dan AsaWatch adalah produk yang akan
  # dijual (rencana-produksi.md §10). 1.35.x masih BSD 3-Clause.
  flutter_blue_plus: ^1.35.5
  # Dipatok ke 12.x: 13.x menarik permission_handler_android 14 yang menuntut
  # compileSdk 37, sementara Android Gradle Plugin di proyek ini berhenti di 36.
  # 12.x memberi API yang persis sama untuk keperluan IzinBle.
  permission_handler: ^12.0.1
  # Satu-satunya pemakainya adalah `AuthHttpService`. Dipilih ketimbang `dio`
  # justru karena ia menyediakan `package:http/testing.dart` (`MockClient`):
  # soketnya bisa dipalsukan tanpa memalsukan `AuthHttpService` itu sendiri,
  # sehingga penyusunan URL, header, dan pembacaan JSON yang sungguhan tetap
  # ikut teruji.
  http: ^1.6.0
  # Token membuka data kesehatan, jadi ia tidak boleh menumpang
  # `shared_preferences`: di Android itu berkas XML polos di direktori aplikasi.
  # `flutter_secure_storage` memakai EncryptedSharedPreferences (Keystore).
  #
  # Dipatok ke 9.x karena alasan yang sama persis dengan `permission_handler`:
  # 11.x menuntut `compileSdk 37`, sementara AGP di proyek ini berhenti di 36.
  # API yang dipakai `SesiLoginRepositoryAman` (read/write/delete) sama di
  # keduanya.
  flutter_secure_storage: ^9.2.4
  # Kamera deteksi makanan. `camera` menyediakan pratinjau langsung (yang
  # `image_picker` tidak punya — ia hanya membuka aplikasi kamera sistem), dan
  # `image_picker` tetap ikut untuk jalur "ambil dari galeri". `path_provider`
  # dipakai memindahkan hasil jepretan dari folder cache ke folder dokumen:
  # jalur foto disimpan di basis data sesi dan harus tetap sahih berbulan-bulan.
  # Minimal 0.12: versi sebelumnya menarik `camera_android_camerax` yang masih
  # memasang Kotlin Gradle Plugin sendiri, dan Flutter sudah memperingatkan
  # bahwa rakitan seperti itu akan gagal di versi mendatang (Built-in Kotlin).
  camera: ^0.12.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter_icons:
  android: true
  image_path: "assets/logo/logo asawatch.png"

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  assets:
    - assets/fonts/OFL.txt

  # Montserrat is the family referenced by ThemeData.fontFamily in lib/main.dart.
  # Weights match the FontWeight values used across the UI (normal/w500/w600/bold).
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
